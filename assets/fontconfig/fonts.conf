<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Shell UI font only. Scoped to the omarchy-shell process itself
       (prgname="quickshell") rather than the generic "monospace" family:
       fontconfig auto-appends "monospace" as a fallback entry to nearly
       every monospace font request system-wide, so an unscoped rule on
       family=monospace with prepend_first+strong would also win over apps
       that request JetBrainsMono Nerd Font / monospace explicitly.
       Mirrors archultra. -->
  <match target="pattern">
    <test name="prgname"><string>quickshell</string></test>
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Google Sans Flex</string>
    </edit>
  </match>
</fontconfig>
